name: vendor_app
description: A multi-vendor e-commerce marketplace app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  fl_chart: ^0.71.0
  intl: ^0.20.2
  image_picker: ^1.0.4
  shared_preferences: ^2.2.1
  http: ^1.1.0
  url_launcher: ^6.1.14
  share_plus: ^11.0.0
  path_provider: ^2.1.1
  permission_handler: ^12.0.0+1
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.7
  shimmer: ^3.0.0
  timezone: ^0.10.1
  video_player: ^2.10.0
  flutter_secure_storage: ^9.2.4
  path: ^1.8.3
  dotted_border: ^2.0.0
  photo_manager: ^3.0.0
  wechat_assets_picker: ^9.2.1
  image_cropper: ^9.1.0
  image: ^4.1.7
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  connectivity_plus: ^5.0.2
  crypto: ^3.0.3

  # ✅ Firebase: aligned versions
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.0
  firebase_analytics: ^11.3.0
  firebase_messaging: ^15.1.0
  firebase_dynamic_links: ^6.0.0

  # ✅ Notifications
  awesome_notifications: ^0.10.1
  app_links: ^6.4.0
  smooth_page_indicator: ^1.2.1
  glassmorphism: ^3.0.0
  flutter_rating_bar: ^4.0.1
  timeago: ^3.7.1
  google_fonts: ^6.2.1
  dio: ^5.8.0+1
  password_strength_checker: ^1.2.4
  password_strength_indicator_plus: ^0.0.1
  flutter_image_compress: ^2.4.0
  
  # ✅ PDF Generation
  pdf: ^3.10.7
  printing: ^5.12.0

dependency_overrides:
  firebase_auth_platform_interface: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.8
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
